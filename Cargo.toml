[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "ISC"
rust-version = "1.85"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Crypto
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
reed-solomon-erasure = "6"

# Storage
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# CLI
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
comfy-table = "7"

# Logging
tracing = "0.1"

# Testing
mockall = "0.13"
proptest = "1"
tempfile = "3"

# Internal
tesseras-core = { path = "crates/tesseras-core" }
tesseras-crypto = { path = "crates/tesseras-crypto" }
tesseras-storage = { path = "crates/tesseras-storage" }
