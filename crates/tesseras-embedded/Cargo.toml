[package]
name = "tesseras-embedded"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "tesseras_embedded"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
tesseras-core = { workspace = true, features = ["service"] }
tesseras-crypto = { workspace = true, features = ["classical", "service"] }
tesseras-storage = { workspace = true }
tesseras-net = { workspace = true }
tesseras-dht = { workspace = true }
tesseras-replication = { workspace = true }
rusqlite = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { workspace = true }
flutter_rust_bridge = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
mockall = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(frb_expand)'] }

[features]
default = []
bundled-sqlite = ["tesseras-storage/bundled-sqlite"]
