[package]
name = "tesseras-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "tes"
path = "src/main.rs"

[dependencies]
tesseras-core = { workspace = true, features = ["service"] }
tesseras-crypto = { workspace = true, features = ["classical", "service", "shamir", "encryption"] }
tesseras-rpc = { workspace = true }
tesseras-storage = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
dialoguer = { workspace = true }
dirs = { workspace = true }
comfy-table = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
blake3 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
hickory-resolver = { workspace = true }
qr_code = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
owo-colors = { workspace = true }
libc = "0.2.182"

[features]
default = []
bundled-sqlite = ["tesseras-storage/bundled-sqlite"]
