[package]
name = "tesseras-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WASM build for browser tessera verification"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
tesseras-core = { workspace = true }
blake3 = { version = "1", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
hex = { workspace = true }

# Pure Rust ML-DSA (FIPS 204) — no C dependencies
# TODO: add ml-dsa when compat test confirms interoperability
# ml-dsa = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
# C-based Dilithium — only for cross-crate compat test
# pqcrypto-dilithium = "0.5"
# pqcrypto-traits = { workspace = true }

