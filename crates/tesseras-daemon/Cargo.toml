[package]
name = "tesseras-daemon"
version = "0.1.0"
description = "Tesseras P2P daemon and CLI — full node for desktop, server, and Raspberry Pi"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "tesseras_daemon"
path = "src/lib.rs"

[[bin]]
name = "tesd"
path = "src/main.rs"

[dependencies]
tesseras-core = { workspace = true, features = ["service"] }
tesseras-crypto = { workspace = true, features = ["classical", "service"] }
tesseras-storage = { workspace = true }
tesseras-net = { workspace = true }
tesseras-dht = { workspace = true }
tesseras-replication = { workspace = true }
tesseras-rpc = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
hex = { workspace = true }
hickory-resolver = { workspace = true }
prometheus = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
mockall = { workspace = true }
rusqlite = { workspace = true }

[features]
default = []
bundled-sqlite = ["tesseras-storage/bundled-sqlite"]

[package.metadata.deb]
maintainer = "tesseras maintainers"
copyright = "ISC"
depends = "libc6, libsqlite3-0"
section = "net"
priority = "optional"
maintainer-scripts = "../../packaging/debian/scripts/"
assets = [
    ["target/release/tesd", "usr/bin/", "755"],
    ["target/release/tes", "usr/bin/", "755"],
    ["../../packaging/debian/tesd.default.toml", "etc/tesseras/config.toml", "644"],
    ["../../packaging/debian/tesd.service", "lib/systemd/system/tesd.service", "644"],
    ["target/release/tes.bash", "usr/share/bash-completion/completions/tes", "644"],
    ["target/release/_tes", "usr/share/zsh/vendor-completions/_tes", "644"],
    ["target/release/tes.fish", "usr/share/fish/vendor_completions.d/tes.fish", "644"],
]
conf-files = ["/etc/tesseras/config.toml"]
systemd-units = { unit-name = "tesd", unit-scripts = "../../packaging/debian", enable = true, start = false }
