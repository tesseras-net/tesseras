[package]
name = "tesseras-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tesseras-core = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

# Classical crypto (default)
blake3 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

# Encryption (hybrid KEM + AES-GCM)
chrono = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }
aes-gcm = { workspace = true, optional = true }
pqcrypto-kyber = { workspace = true, optional = true }
pqcrypto-traits = { workspace = true, optional = true }

# Erasure coding
reed-solomon-erasure = { workspace = true, optional = true }

# Shamir's Secret Sharing (serialization)
serde = { workspace = true, optional = true }
rmp-serde = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[dev-dependencies]
bolero = { workspace = true }
chrono = { workspace = true }
hex = "0.4"
proptest = { workspace = true }

[features]
default = ["classical"]
classical = ["blake3", "ed25519-dalek", "rand"]
erasure = ["reed-solomon-erasure"]
encryption = ["chrono", "x25519-dalek", "aes-gcm", "pqcrypto-kyber", "pqcrypto-traits", "blake3", "rand"]
service = ["tesseras-core/service"]
shamir = ["serde", "rmp-serde", "base64", "blake3", "rand"]
experimental-visibility = ["tesseras-core/experimental-visibility"]
