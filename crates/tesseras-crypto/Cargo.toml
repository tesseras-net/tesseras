[package]
name = "tesseras-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tesseras-core = { workspace = true }
thiserror = { workspace = true }

# Classical crypto (default)
blake3 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

# Erasure coding
reed-solomon-erasure = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }

[features]
default = ["classical"]
classical = ["blake3", "ed25519-dalek", "rand"]
erasure = ["reed-solomon-erasure"]
service = ["tesseras-core/service"]
