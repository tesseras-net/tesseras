services:
  # Bootstrap node — runs the daemon
  bootstrap1:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    command: ["admin", "daemon", "start", "--foreground"]
    volumes:
      - bootstrap1-data:/data
    environment:
      - TES_IDENTITY=/data
    networks:
      tesseras-net:
        ipv4_address: 10.10.0.10

  # Client nodes — run ad-hoc commands, bootstrap from bootstrap1
  alice:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    command: ["sleep", "infinity"]
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - alice-data:/data
    environment:
      - TES_IDENTITY=/data
    networks:
      tesseras-net:
        ipv4_address: 10.10.1.10

  bob:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    command: ["sleep", "infinity"]
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - bob-data:/data
    environment:
      - TES_IDENTITY=/data
    networks:
      tesseras-net:
        ipv4_address: 10.10.1.11

  charlie:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    command: ["sleep", "infinity"]
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - charlie-data:/data
    environment:
      - TES_IDENTITY=/data
    networks:
      tesseras-net:
        ipv4_address: 10.10.1.12

networks:
  tesseras-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/16

volumes:
  bootstrap1-data:
  alice-data:
  bob-data:
  charlie-data:
