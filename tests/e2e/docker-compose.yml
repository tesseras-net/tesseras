services:
  # Bootstrap node — runs the daemon, serves as the DHT entry point
  bootstrap1:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    command: ["tes", "--identity=/data", "admin", "daemon", "start", "--foreground"]
    volumes:
      - bootstrap1-data:/data
    environment:
      - TES_IDENTITY=/data
      - TES_LISTEN=10.10.0.10:4433
      - TES_BOOTSTRAP=
    networks:
      tesseras-net:
        ipv4_address: 10.10.0.10

  # Second bootstrap for redundancy testing
  bootstrap2:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    command: ["tes", "--identity=/data", "admin", "daemon", "start", "--foreground"]
    volumes:
      - bootstrap2-data:/data
    environment:
      - TES_IDENTITY=/data
      - TES_LISTEN=10.10.0.11:4433
      - TES_BOOTSTRAP=10.10.0.10:4433
    networks:
      tesseras-net:
        ipv4_address: 10.10.0.11

  # Client nodes — run ad-hoc commands, bootstrap from bootstrap1
  alice:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    command: ["sleep", "86400"]
    volumes:
      - alice-data:/data
    environment:
      - TES_IDENTITY=/data
      - TES_LISTEN=10.10.1.10:4433
      - TES_BOOTSTRAP=10.10.0.10:4433
    networks:
      tesseras-net:
        ipv4_address: 10.10.1.10

  bob:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    command: ["sleep", "86400"]
    volumes:
      - bob-data:/data
    environment:
      - TES_IDENTITY=/data
      - TES_LISTEN=10.10.1.11:4433
      - TES_BOOTSTRAP=10.10.0.10:4433
    networks:
      tesseras-net:
        ipv4_address: 10.10.1.11

  charlie:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    command: ["sleep", "86400"]
    volumes:
      - charlie-data:/data
    environment:
      - TES_IDENTITY=/data
      - TES_LISTEN=10.10.1.12:4433
      - TES_BOOTSTRAP=10.10.0.10:4433
    networks:
      tesseras-net:
        ipv4_address: 10.10.1.12

  dave:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    command: ["sleep", "86400"]
    volumes:
      - dave-data:/data
    environment:
      - TES_IDENTITY=/data
      - TES_LISTEN=10.10.1.13:4433
      - TES_BOOTSTRAP=10.10.0.10:4433
    networks:
      tesseras-net:
        ipv4_address: 10.10.1.13

  eve:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    command: ["sleep", "86400"]
    volumes:
      - eve-data:/data
    environment:
      - TES_IDENTITY=/data
      - TES_LISTEN=10.10.1.14:4433
      - TES_BOOTSTRAP=10.10.0.10:4433
    networks:
      tesseras-net:
        ipv4_address: 10.10.1.14

networks:
  tesseras-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/16

volumes:
  bootstrap1-data:
  bootstrap2-data:
  alice-data:
  bob-data:
  charlie-data:
  dave-data:
  eve-data:
